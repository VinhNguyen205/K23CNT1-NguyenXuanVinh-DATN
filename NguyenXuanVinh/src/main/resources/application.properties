spring.application.name=NguyenXuanVinh-TaskTale

# File cau hinh bi mat cua may local (da them vao .gitignore). Khong co file nay thi bo qua.
spring.config.import=optional:classpath:application-local.properties
server.port=8080

# 1. KET NOI SQL SERVER (NxvTaskTaleDB)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NxvTaskTaleDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# Mat khau DB: dat trong application-local.properties (khong commit) hoac bien moi truong SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. CAU HINH HIBERNATE GIU NGUYEN TEN BANG & COT PASCALCASE (Users, NxvTasks...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# 3. CAU HINH JWT & SWAGGER
# JWT secret (>= 32 ky tu): dat nxv.jwt.secret trong application-local.properties hoac bien moi truong NXV_JWT_SECRET
nxv.jwt.expiration-ms=86400000
springdoc.swagger-ui.path=/swagger-ui.html

# --- Bao mat / tinh nang (them o v2.2) ---
# Tat Open-Session-In-View: tranh query lazy ngam trong tang View
spring.jpa.open-in-view=false
# Origin cua frontend React (phan tach bang dau phay)
nxv.cors.allowed-origins=${NXV_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
# Google OAuth2 Client ID (Google Cloud Console > Credentials). De trong = tat dang nhap Google
nxv.google.client-id=${NXV_GOOGLE_CLIENT_ID:}
# true = tra ma OTP trong response de test tren Swagger (CHI DEV). Khi deploy dat NXV_OTP_DEBUG=false
nxv.otp.debug-enabled=${NXV_OTP_DEBUG:true}
# Ghi log gon hon
logging.level.org.hibernate.SQL=warn

